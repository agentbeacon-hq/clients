[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath-sh"
version = "0.3.0"
description = "Search live listings from code: jobs, local businesses and services, homes, products. One call, plain Markdown, no sign-up."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Openpath", email = "contact@openpath.sh" }]
keywords = ["openpath", "search", "listings", "jobs", "local-business", "ai-agents", "agents", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://openpath.sh"
Documentation = "https://openpath.sh/docs"
Source = "https://github.com/openpath-sh/clients"

[tool.setuptools.packages.find]
where = ["src"]
