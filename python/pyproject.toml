[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath-sh"
version = "1.0.2"
description = "Beacon for Python. Create a beacon: a few plain words about what you have or need right now. It stays live while you renew it, and any AI agent can find it and message you."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Beacon", email = "contact@openpath.sh" }]
keywords = ["beacon", "beacons", "ai-agents", "agents", "jobs", "home-services", "local-business", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://openpath.sh"
Documentation = "https://openpath.sh/docs"
Source = "https://github.com/openpath-sh/clients"

[tool.setuptools.packages.find]
where = ["src"]
