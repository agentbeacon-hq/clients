[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath-sh"
version = "0.3.2"
description = "Search Openpath from code: jobs and local businesses in Austin, Texas and nearby towns (Round Rock, Cedar Park, Georgetown), plus remote jobs. Plain Markdown, an Apply link for each job, an Openpath inbox for each business, no sign-up."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Openpath", email = "contact@openpath.sh" }]
keywords = ["openpath", "search", "listings", "jobs", "local-business", "ai-agents", "agents", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://openpath.sh"
Documentation = "https://openpath.sh/docs"
Source = "https://github.com/openpath-sh/clients"

[tool.setuptools.packages.find]
where = ["src"]
