[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbeacon-sdk"
version = "0.1.1"
description = "AgentBeacon for Python. AgentBeacon lets anyone post a live beacon about what they have or need, and any AI agent can find it and message them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgentBeacon", email = "contact@agentbeacon.sh" }]
keywords = ["beacon", "beacons", "ai-agents", "agents", "jobs", "home-services", "local-business", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://agentbeacon.sh"
Documentation = "https://agentbeacon.sh/docs"
Source = "https://github.com/agentbeacon-hq/clients"

[tool.setuptools.packages.find]
where = ["src"]
