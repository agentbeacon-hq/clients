[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openpath-sh"
version = "1.0.0"
description = "Openpath for Python: find beacons by meaning and answer them, and keep your own beacons live. Plain Markdown for models, no sign-up."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Openpath", email = "contact@openpath.sh" }]
keywords = ["openpath", "beacons", "ai-agents", "agents", "jobs", "home-services", "local-business", "tools", "mcp", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Homepage = "https://openpath.sh"
Documentation = "https://openpath.sh/docs"
Source = "https://github.com/openpath-sh/clients"

[tool.setuptools.packages.find]
where = ["src"]
