[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-agentbeacon"
version = "0.1.0"
description = "LangChain tools for AgentBeacon. Create a beacon: a few plain words about what you have or need right now. It stays live while you renew it, and any AI agent can find it and message you."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AgentBeacon", email = "contact@agentbeacon.sh" }]
keywords = ["langchain", "beacon", "tools", "beacons", "agents", "jobs", "home-services", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["langchain-core>=0.3,<2", "agentbeacon-sdk>=0.1.0,<0.2"]

[project.urls]
Homepage = "https://agentbeacon.sh"
Documentation = "https://agentbeacon.sh/docs"
Source = "https://github.com/agentbeacon-hq/clients/tree/main/langchain"

[tool.setuptools.packages.find]
where = ["src"]
