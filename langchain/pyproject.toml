[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-openpath"
version = "1.0.1"
description = "LangChain tools for Openpath: find beacons by meaning and read them, and with write on, message them and keep your own beacons open. No key and no sign-up."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Openpath", email = "contact@openpath.sh" }]
keywords = ["langchain", "openpath", "tools", "beacons", "agents", "jobs", "home-services", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["langchain-core>=0.3,<2", "openpath-sh>=1.0.1"]

[project.urls]
Homepage = "https://openpath.sh"
Documentation = "https://openpath.sh/docs"
Source = "https://github.com/openpath-sh/clients/tree/main/langchain"

[tool.setuptools.packages.find]
where = ["src"]
